<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你校园信息中心 - 校园三维导览</title>
  <!-- Bootstrap 5 CSS（CDN 引入） -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- 自定义 CSS -->
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <!-- 导航栏：四个入口（可返回首页） -->
  <nav class="navbar navbar-expand-lg navbar-dark campus-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-mortarboard-fill me-2" viewBox="0 0 16 16">
          <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0L14 7.14V13a1 1 0 0 0-1 1v.5h-1v-3a.5.5 0 0 0-1 0v3H5.5a.5.5 0 0 0 0 1h9a.5.5 0 0 0 .5-.5V14a1 1 0 0 0-1-1V6.39l1.686-.674a.5.5 0 0 0 .025-.917l-7.5-3.5Z"/>
        </svg>
        迷你校园信息中心
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="../index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="../rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="../stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 三维场景容器 -->
  <div id="threeCanvasWrap">
    <div class="scene-tip">校园三维导览：左键拖动旋转 · 滚轮缩放 · 右键平移 · 点击导航“首页”返回</div>
  </div>

  <!-- Bootstrap 5 JS Bundle（CDN 引入） -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- 公共脚本：断网提示 -->
  <script src="../js/common.js"></script>
  <!-- Three.js r128（CDN 引入，全局 THREE） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- 校园三维场景（课堂七场景搬入） -->
  <script>
  (function () {
    var wrap = document.getElementById('threeCanvasWrap');

    // Three.js 未能加载（如离线）时给出明确提示
    if (typeof THREE === 'undefined') {
      wrap.innerHTML = '<div class="alert alert-warning m-4">Three.js 未能加载，请联网后刷新页面。</div>';
      return;
    }

    // ---------- 基础三件套 ----------
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfe3f5);
    scene.fog = new THREE.Fog(0xbfe3f5, 60, 110);

    var camera = new THREE.PerspectiveCamera(50, wrap.clientWidth / wrap.clientHeight, 0.1, 200);
    camera.position.set(26, 20, 30);

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    wrap.appendChild(renderer.domElement);

    // ---------- 灯光 ----------
    scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6b8f4a, 0.45));
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    var sun = new THREE.DirectionalLight(0xffffff, 0.95);
    sun.position.set(24, 34, 18);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -45;
    sun.shadow.camera.right = 45;
    sun.shadow.camera.top = 45;
    sun.shadow.camera.bottom = -45;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 100;
    scene.add(sun);

    // ---------- 地面、广场与道路 ----------
    var ground = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      new THREE.MeshStandardMaterial({ color: 0x8fbf6f, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    var plaza = new THREE.Mesh(
      new THREE.PlaneGeometry(26, 18),
      new THREE.MeshStandardMaterial({ color: 0xcfd4d9 })
    );
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.y = 0.02;
    plaza.receiveShadow = true;
    scene.add(plaza);

    function addPath(x, z, w, d) {
      var path = new THREE.Mesh(
        new THREE.PlaneGeometry(w, d),
        new THREE.MeshStandardMaterial({ color: 0xb4b9bf })
      );
      path.rotation.x = -Math.PI / 2;
      path.position.set(x, 0.015, z);
      path.receiveShadow = true;
      scene.add(path);
    }
    addPath(0, -12, 3, 18);   // 向北（宿舍方向）
    addPath(-13, 4, 18, 3);   // 向西
    addPath(14, 4, 16, 3);    // 向东
    addPath(-12, 15, 3, 12);  // 体育馆
    addPath(12, 15, 3, 12);   // 行政楼

    // ---------- 建筑（校园地标） ----------
    var BUILDINGS = [
      { name: '图书馆',   x: 0,   z: 0,   w: 8,  h: 9,   d: 6, color: 0x3b82c4 },
      { name: '主教学楼', x: -16, z: -6,  w: 12, h: 6,   d: 5, color: 0xe8893f },
      { name: '理科楼',   x: 16,  z: -7,  w: 9,  h: 7,   d: 6, color: 0x5a9e6f },
      { name: '体育馆',   x: -16, z: 13,  w: 10, h: 4,   d: 8, color: 0x43b3ae },
      { name: '行政楼',   x: 15,  z: 13,  w: 8,  h: 5.5, d: 5, color: 0x9b6bb0 },
      { name: '学生宿舍', x: 0,   z: -20, w: 14, h: 7.5, d: 5, color: 0xd46a7e }
    ];

    // 名称标签：Canvas 纹理 Sprite
    function makeLabel(text) {
      var canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 72;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(22, 58, 102, 0.85)';
      ctx.fillRect(0, 10, 256, 52);
      ctx.font = 'bold 28px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 37);

      var texture = new THREE.CanvasTexture(canvas);
      var sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
      sprite.scale.set(6.5, 1.8, 1);
      return sprite;
    }

    BUILDINGS.forEach(function (b) {
      var geometry = new THREE.BoxGeometry(b.w, b.h, b.d);
      var building = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.75 })
      );
      building.position.set(b.x, b.h / 2, b.z);
      building.castShadow = true;
      building.receiveShadow = true;
      scene.add(building);

      // 轮廓线，增强建筑体块感
      var edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
      );
      edges.position.copy(building.position);
      scene.add(edges);

      var label = makeLabel(b.name);
      label.position.set(b.x, b.h + 2.2, b.z);
      scene.add(label);
    });

    // ---------- 树木 ----------
    function addTree(x, z, scale) {
      var group = new THREE.Group();
      var trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.24, 1.4, 8),
        new THREE.MeshStandardMaterial({ color: 0x8d5a2b })
      );
      trunk.position.y = 0.7;
      trunk.castShadow = true;
      var leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.1, 2.4, 10),
        new THREE.MeshStandardMaterial({ color: 0x3e7d3a })
      );
      leaves.position.y = 2.5;
      leaves.castShadow = true;
      group.add(trunk, leaves);
      group.position.set(x, 0, z);
      group.scale.setScalar(scale || 1);
      scene.add(group);
    }

    [
      [-10, -2], [10, -2], [-10, 7], [10, 7],
      [-6, 12], [6, 12], [-22, 3], [22, 3],
      [-7, -14], [7, -14], [-24, -12], [24, -12]
    ].forEach(function (p) {
      addTree(p[0], p[1], 1);
    });

    // ---------- 交互控制 ----------
    var controls;
    if (THREE.OrbitControls) {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.target.set(0, 2, 0);
      controls.minDistance = 10;
      controls.maxDistance = 80;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.6;
      controls.update();
    } else {
      controls = { update: function () {} };
    }

    // ---------- 自适应 ----------
    window.addEventListener('resize', function () {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });

    // ---------- 渲染循环 ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  })();
  </script>
</body>
</html>
